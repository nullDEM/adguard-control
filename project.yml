name: AdGuardControl
options:
  bundleIdPrefix: pl.adguardcontrol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: pl
targets:
  AdGuardControl:
    type: application
    platform: iOS
    sources:
      - AdGuardControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.adguardcontrol.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "AdGuard Control"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Aplikacja łączy się z Twoim serwerem AdGuard Home w sieci lokalnej lub w tailnecie."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    entitlements:
      path: AdGuardControl/AdGuardControl.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pl.adguardcontrol.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)pl.adguardcontrol.shared
    dependencies:
      - target: AdGuardWidgets
    info:
      path: AdGuardControl/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: pl.adguardcontrol.app
            CFBundleURLSchemes:
              - adguardcontrol
        # ATS nie potrafi objąć wyjątkiem zakresu Tailscale (100.64.0.0/10) – testy pokazały, że HTTP do adresu 100.x
        # jest blokowane nawet z NSAllowsLocalNetworking. Dlatego ATS jest wyłączony, a jego rolę przejmuje
        # AddressPolicy (AdGuardAPIClient.perform sprawdza każde żądanie): HTTP tylko do tailnetu / sieci prywatnej,
        # publiczne hosty wyłącznie przez HTTPS, brak przekierowań, brak wyłączania weryfikacji TLS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  AdGuardWidgets:
    type: app-extension
    platform: iOS
    sources:
      - AdGuardWidgets
      - AdGuardControl/Models
      - AdGuardControl/Networking
      - AdGuardControl/Storage
      - AdGuardControl/Utilities
      - AdGuardControl/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.adguardcontrol.app.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "AdGuard Control"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Widget odczytuje stan Twojego serwera AdGuard Home w sieci lokalnej lub w tailnecie."
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: AdGuardWidgets/AdGuardWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pl.adguardcontrol.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)pl.adguardcontrol.shared
    info:
      path: AdGuardWidgets/Info.plist
      properties:
        CFBundleDisplayName: AdGuard Control
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  AdGuardControlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AdGuardControlTests
    dependencies:
      - target: AdGuardControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.adguardcontrol.tests
        GENERATE_INFOPLIST_FILE: YES
  AdGuardControlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AdGuardControlUITests
    dependencies:
      - target: AdGuardControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.adguardcontrol.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AdGuardControl:
    build:
      targets:
        AdGuardControl: all
        AdGuardWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AdGuardControlTests
        - AdGuardControlUITests
